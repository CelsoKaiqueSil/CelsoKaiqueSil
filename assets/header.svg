<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Celso Kaique — Analista de Dados, BI e Automação</title>
  <desc>Cabeçalho tecnológico com conexões de dados e especialidades profissionais.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06131F"/>
      <stop offset="0.52" stop-color="#0A243B"/>
      <stop offset="1" stop-color="#122D49"/>
    </linearGradient>
    <linearGradient id="accent" x1="320" y1="65" x2="890" y2="245" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4FA3FF"/>
      <stop offset="0.5" stop-color="#43D68E"/>
      <stop offset="1" stop-color="#9B8CFF"/>
    </linearGradient>
    <radialGradient id="spot" cx="0" cy="0" r="1" gradientTransform="translate(600 140) rotate(90) scale(180 470)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17466A" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#071522" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#7190A9" stroke-opacity="0.10"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#background)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="24" fill="url(#spot)"/>
  <path d="M0 245C155 209 279 270 430 240C576 211 678 129 824 145C969 161 1065 228 1200 186V300H0V245Z" fill="#081A2A" fill-opacity="0.82"/>

  <g stroke="url(#accent)" stroke-width="2" stroke-opacity="0.56">
    <path d="M50 75L135 119L218 74L316 116"/>
    <path d="M884 79L970 121L1060 70L1150 114"/>
    <path d="M55 229L142 190L225 231"/>
    <path d="M972 225L1054 187L1144 228"/>
  </g>

  <g fill="#43D68E" filter="url(#glow)">
    <circle cx="50" cy="75" r="5"/><circle cx="135" cy="119" r="5"/>
    <circle cx="218" cy="74" r="5"/><circle cx="316" cy="116" r="5"/>
    <circle cx="884" cy="79" r="5"/><circle cx="970" cy="121" r="5"/>
    <circle cx="1060" cy="70" r="5"/><circle cx="1150" cy="114" r="5"/>
  </g>

  <g fill="#57A7FF" opacity="0.88">
    <circle cx="55" cy="229" r="4"/><circle cx="142" cy="190" r="4"/><circle cx="225" cy="231" r="4"/>
    <circle cx="972" cy="225" r="4"/><circle cx="1054" cy="187" r="4"/><circle cx="1144" cy="228" r="4"/>
  </g>

  <rect x="405" y="38" width="390" height="34" rx="17" fill="#102E46" stroke="#2B5873"/>
  <circle cx="430" cy="55" r="6" fill="#43D68E"/>
  <text x="447" y="61" fill="#B8D0E2" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.2">DADOS • BI • AUTOMAÇÃO</text>

  <text x="600" y="137" text-anchor="middle" fill="#F5F9FC" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="1">CELSO KAIQUE</text>
  <rect x="363" y="156" width="474" height="4" rx="2" fill="url(#accent)"/>
  <text x="600" y="197" text-anchor="middle" fill="#C4D8E7" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="650">ANALISTA DE DADOS JR.  •  BI  •  AUTOMAÇÃO</text>
  <text x="600" y="233" text-anchor="middle" fill="#78A2C2" font-family="Consolas, monospace" font-size="15">transformando operações em indicadores e decisões</text>
</svg>
