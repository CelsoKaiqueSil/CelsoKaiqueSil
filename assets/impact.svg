<svg width="1200" height="178" viewBox="0 0 1200 178" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Impacto profissional em números</title>
  <desc>Relatórios reduzidos de cinco a seis horas para minutos, 709 unidades, 1.689 links e 400 a 500 chamados mensais.</desc>
  <defs>
    <linearGradient id="impactBackground" x1="0" y1="0" x2="1200" y2="178" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071522"/>
      <stop offset="1" stop-color="#102B43"/>
    </linearGradient>
    <linearGradient id="metricAccent" x1="35" y1="25" x2="1165" y2="151" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4FA3FF"/>
      <stop offset="0.52" stop-color="#43D68E"/>
      <stop offset="1" stop-color="#9B8CFF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="178" rx="20" fill="url(#impactBackground)"/>
  <rect x="22" y="22" width="278" height="134" rx="14" fill="#0D263B" stroke="#244963"/>
  <rect x="315" y="22" width="278" height="134" rx="14" fill="#0D263B" stroke="#244963"/>
  <rect x="608" y="22" width="278" height="134" rx="14" fill="#0D263B" stroke="#244963"/>
  <rect x="901" y="22" width="277" height="134" rx="14" fill="#0D263B" stroke="#244963"/>

  <rect x="42" y="42" width="4" height="94" rx="2" fill="url(#metricAccent)"/>
  <rect x="335" y="42" width="4" height="94" rx="2" fill="url(#metricAccent)"/>
  <rect x="628" y="42" width="4" height="94" rx="2" fill="url(#metricAccent)"/>
  <rect x="921" y="42" width="4" height="94" rx="2" fill="url(#metricAccent)"/>

  <text x="63" y="75" fill="#F3F8FC" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="800">5–6 h → minutos</text>
  <text x="63" y="103" fill="#8FACC2" font-family="Segoe UI, Arial, sans-serif" font-size="14">relatório semanal automatizado</text>
  <text x="63" y="127" fill="#5FA9E3" font-family="Consolas, monospace" font-size="12">EFICIÊNCIA</text>

  <text x="356" y="75" fill="#F3F8FC" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="800">709 unidades</text>
  <text x="356" y="103" fill="#8FACC2" font-family="Segoe UI, Arial, sans-serif" font-size="14">escala operacional acompanhada</text>
  <text x="356" y="127" fill="#43D68E" font-family="Consolas, monospace" font-size="12">MONITORAMENTO</text>

  <text x="649" y="75" fill="#F3F8FC" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="800">1.689 links</text>
  <text x="649" y="103" fill="#8FACC2" font-family="Segoe UI, Arial, sans-serif" font-size="14">visibilidade de infraestrutura</text>
  <text x="649" y="127" fill="#43D68E" font-family="Consolas, monospace" font-size="12">DADOS OPERACIONAIS</text>

  <text x="942" y="75" fill="#F3F8FC" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800">400–500/mês</text>
  <text x="942" y="103" fill="#8FACC2" font-family="Segoe UI, Arial, sans-serif" font-size="14">chamados tratados e validados</text>
  <text x="942" y="127" fill="#9B8CFF" font-family="Consolas, monospace" font-size="12">SERVICE DESK</text>
</svg>
